name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish self-contained (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Zip (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path publish/* -Destination "ManuskriptHelfer-${{ github.ref_name }}.zip"

      - name: Upload Artifact (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: ManuskriptHelfer-*.zipname: Build

